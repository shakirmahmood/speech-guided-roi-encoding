# Output format of the "what to look at" step (prompt option: goal).
# Never change what a field means or allows without a new version and a line under changes.
# Earlier versions stay in git history; every saved result records the version it used.
version: look_at-3
changes:
  - "look_at-1 (2026-10-13): first version."
  - "look_at-2 (2026-10-13): a list of things is made once per video from the whole transcript
    (things); key is now the id of a thing from that list, or new. left_out only lists things
    (objects, people, animals) mentioned but not here now; not_a_thing removed from why."
  - "look_at-3 (2026-10-14): generic step-1 prompt; the things field definitions are shortened to
    match it, and the things section has no about line (the step-1 instructions say what the list is)."

things:                       # made once per video from the whole transcript, words only
  fields:
    id:
      values: text
      definition: a short, unique, lowercase name for it
    what:
      values: text
      definition: a short description of it
    first_mention:
      values: text
      definition: >
        where it is first mentioned: "<sentence number>: <words>"
    also_called:
      values: list of text
      definition: every other word or phrase in the transcript that refers to it

look_at:
  about: one entry per thing the viewer looks at because of this sentence.
  fields:
    reason:
      values: text
      definition: one short sentence - why the viewer looks at it now.
    key:
      values: id
      definition: >
        the id of the thing in the list of things in this video. Use new only for a thing
        that is not in the list (for example one that is only seen in the frames).
    search_for:
      values: text
      definition: >
        a short visual description to find it in the frame. For a part, say what it
        belongs to ("the doll's hair", not "hair").
    on_screen:
      values: ["yes", "no", "unsure"]
      definition: from the frames.
    attention:
      values: [high, medium, low]
      definition: |
        high - the speaker directs the viewer to it ("look", "watch", "see that") or it is what the sentence is about;
        medium - it is talked about;
        low - only implied, or background to what is said.
    main_clue:
      values: [named, pronoun, name, pointing, implied, other]

left_out:
  about: only things (objects, people, animals) mentioned in this sentence but not here now.
  fields:
    words:
      values: text
    why:
      values: [past, future, elsewhere, hypothetical, general, absent, figure_of_speech]
